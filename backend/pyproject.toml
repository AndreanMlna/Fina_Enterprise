[project]
name = "fina-enterprise-backend"
version = "2.4.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.3",
    "asyncpg>=0.29.0",
    "pgvector>=0.3.5",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.2",
    "numpy>=2.1.0",
    "pyjwt>=2.9.0",
    "google-genai>=1.0.0",
    "pillow>=10.0.0",
    "python-multipart>=0.0.12"
]

[tool.vercel]
entrypoint = "main:app"
